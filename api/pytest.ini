[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Repo root on sys.path so `import main` works
pythonpath = .

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    --timeout=60
