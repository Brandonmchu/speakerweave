# Rendered from /etc/nginx/templates/default.conf.template at container start.
# Only ${BACKEND_URL} is substituted (NGINX_ENVSUBST_FILTER in the Dockerfile) —
# nginx's own $uri/$host survive.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset UTF-8;

    server_tokens off;
    autoindex off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript image/svg+xml font/woff font/woff2;
    # The build emits matching .gz siblings. nginx:alpine includes the standard
    # gzip_static module, avoiding per-request compression work for SPA assets.
    gzip_static on;

    # Resolve the backend at request time via a variable — without this nginx
    # refuses to start whenever DNS is briefly unavailable.
    #
    # BACKEND_URL must be scheme+host+port with NO trailing slash and no path
    # (e.g. https://dais-api.up.railway.app). Because proxy_pass here uses a
    # variable with no URI part, nginx forwards the original request URI
    # unchanged; a trailing slash would be read as a URI and replace the whole
    # path with "/".
    resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
    set $backend_upstream "${BACKEND_URL}";

    # --- backend ------------------------------------------------------------
    # /api = authed organizer surface, /public = anonymous (CFP forms, agenda),
    # /mcp = the hosted MCP server, and the same-origin /.well-known/oauth-* +
    # /oauth/ routes provide its OAuth 2.1 authorization flow.
    location ~ ^/((api|public)/|mcp(/|$)|oauth/|\.well-known/oauth-) {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        # Upstream is Railway's public edge, which routes BY HOST HEADER and
        # requires SNI — so Host must be the upstream's host ($proxy_host),
        # never the client's, and TLS needs server_name passthrough.
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # --- static -------------------------------------------------------------
    # Hashed assets are content-addressed, so they can be cached forever.
    # NOTE: nginx does NOT inherit add_header into a block that declares its
    # own — each of these blocks is self-contained on purpose.
    location ~* \.(js|css|woff2?|ttf|eot|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(png|jpe?g|gif|ico|svg|webp|avif)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Unlike /assets/*, the favicon name is stable rather than content-hashed.
    location = /favicon.svg {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html carries the asset hashes — it must never be cached, or clients
    # keep booting deleted chunks after a deploy.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # --- public embed pages -------------------------------------------------
    # The /e/ routes are the public schedule/speaker widgets. embed.js drops
    # them into third-party sites via <iframe ...?embed=1>, so they MUST be
    # framable cross-origin — the whole point of the embed. `^~` wins over the
    # regex blocks above so these paths are served as the SPA, but WITHOUT the
    # clickjacking lock the rest of the app keeps.
    #
    # The SPA fallback is a NAMED location (@embed) on purpose: `try_files …
    # /index.html` does an internal redirect that RE-MATCHES location blocks,
    # and the `\.html$` block above would then re-stamp X-Frame-Options:
    # SAMEORIGIN onto the response. Serving /index.html from inside @embed keeps
    # our headers and never re-enters the .html block.
    #
    # X-Frame-Options has no "allow any origin" value, so we drop it here and
    # use CSP frame-ancestors * instead (the modern, more expressive control).
    # The organizer app under `location /` stays SAMEORIGIN-locked.
    location ^~ /e/ {
        try_files $uri @embed;
    }

    location @embed {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files /index.html =404;
    }

    # --- SPA ----------------------------------------------------------------
    # NOTE: the organizer app's actual clickjacking header is stamped by the
    # `\.html$` block above (the /index.html the fallback lands on), which keeps
    # X-Frame-Options: SAMEORIGIN. This block's header covers direct file hits.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # No $uri/ here: a real directory under dist/ that shares a name with
        # an app route (public/speakers/ vs /speakers) would otherwise win and
        # produce a 301 -> 403 instead of the SPA. Files still match by $uri;
        # everything else is the app.
        try_files $uri /index.html;
    }
}
