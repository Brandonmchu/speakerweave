[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "speakerweave-cli"
version = "0.1.0"
description = "Command-line companion for SpeakerWeave conference operations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "click>=8.1,<9",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
sw = "speakerweave_cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
